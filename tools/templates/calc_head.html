<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crafting cost calculator · Phoenix era 75</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#0c1728; --panel-top:#1b3257; --panel-bot:#11223c; --frame:#8ea6cc; --rule:#31496f;
 --ink:#ece6d6; --ink-soft:#a9b5cb; --ink-faint:#74829e; --link:#9fd0ff;
 --gil:#e8c44a; --gain:#74d3a0; --loss:#ff8f7d; --best:#7fd6a2;
 --fire:#ff7a5c; --ice:#7fd2ff; --wind:#8ce0a8; --earth:#d9b678; --lightning:#c9a0ff; --water:#6fb8ff; --light:#f2e6c0; --dark:#b492d8;
 --wood:#8a6a3f; --smith:#8d94a3; --gold:#e0b64c; --cloth:#c98fb5; --leather:#b5763f; --bone:#ded3bb; --alchemy:#7fc4a8; --cook:#e08f6a;
 --font-display:"Marcellus",Georgia,serif; --font-body:"Atkinson Hyperlegible",system-ui,sans-serif;
 box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
 --bg:#eceff5; --panel-top:#ffffff; --panel-bot:#f3f6fb; --frame:#2f4straight; --frame:#2f4570; --rule:#ccd6e6;
 --ink:#16213a; --ink-soft:#43506b; --ink-faint:#6e7a94; --link:#1a5cb0; --gil:#a8791a; --gain:#12734a; --loss:#b23a2a; --best:#12734a;
 --fire:#c2432a; --ice:#1f7fae; --wind:#2d8a54; --earth:#8a6a2a; --lightning:#6b45b0; --water:#1c69b8; --light:#9a8536; --dark:#6a4a96;
 --wood:#6b4f2c; --smith:#5b6474; --gold:#a1791d; --cloth:#9c5d87; --leather:#8a5526; --bone:#8d8265; --alchemy:#2f7f63; --cook:#b05c34;}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--link) 35%,transparent)}
a:hover{border-bottom-color:var(--link)}
:focus-visible{outline:2px solid var(--gil);outline-offset:2px;border-radius:3px}
.wrap{max-width:1400px;width:92%;margin:0 auto;padding:22px 14px 70px}
.site-nav{display:flex;align-items:center;gap:18px;padding:14px 0;margin-bottom:14px;border-bottom:1px solid var(--rule)}
.site-nav .logo{font-family:var(--font-display);font-size:1.15rem;color:var(--ink);border-bottom:none;white-space:nowrap;text-decoration:none}
.site-nav .logo:hover{color:var(--gil)}
.site-nav .links{display:flex;align-items:center;gap:16px;margin-left:auto;font-size:.88rem}
.site-nav .links a{color:var(--ink-soft);border-bottom:none}
.site-nav .links a:hover{color:var(--ink)}
.search-wrap{position:relative;flex:1;max-width:360px;min-width:0}
#search{width:100%;font:inherit;color:var(--ink);background:color-mix(in srgb,var(--bg) 55%,transparent);
 border:1px solid var(--rule);border-radius:6px;padding:7px 30px 7px 12px;font-size:.88rem}
#search:focus{border-color:var(--gil);outline:none}
#search::placeholder{color:var(--ink-faint)}
.search-wrap .kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:.68rem;
 color:var(--ink-faint);border:1px solid var(--rule);border-radius:3px;padding:0 5px;pointer-events:none;line-height:1.6}
.search-wrap:focus-within .kbd{display:none}
.search-results{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:50;
 background:var(--panel-top);border:1px solid var(--frame);border-radius:8px;
 max-height:min(400px,60vh);overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.4)}
a.sr-item{display:flex;align-items:baseline;gap:8px;padding:8px 12px;color:var(--ink);
 border-bottom:1px solid var(--rule);font-size:.88rem}
a.sr-item:last-child{border-bottom:none}
a.sr-item:hover,a.sr-item.active{background:color-mix(in srgb,var(--gil) 14%,transparent)}
.sr-type{color:var(--ink-faint);font-size:.7rem;margin-left:auto;white-space:nowrap}
.panel{background:linear-gradient(180deg,var(--panel-top),var(--panel-bot));border:1px solid var(--frame);border-radius:8px;
 box-shadow:inset 0 0 0 3px var(--bg),inset 0 0 0 4px var(--rule);margin-bottom:14px}
.pad{padding:20px 22px}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(1.8rem,3.6vw,2.6rem);margin:0 0 .25em;line-height:1.1}
.lede{color:var(--ink-soft);max-width:66ch;margin:0}
/* server profile */
.profile{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--rule)}
.plabel{color:var(--ink-faint);font-size:.78rem}
.combo{position:relative}
.combo-btn{display:flex;align-items:center;gap:9px;font:inherit;color:var(--ink);background:color-mix(in srgb,var(--bg) 55%,transparent);
 border:1px solid var(--rule);border-radius:8px;padding:9px 13px;cursor:pointer;min-width:300px;text-align:left}
.combo-btn:hover{border-color:var(--frame)}
.combo-btn[aria-expanded="true"]{border-color:var(--gil)}
.combo-sub{color:var(--ink-faint);font-size:.8rem;margin-left:2px}
.caret{margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink-faint);border-bottom:2px solid var(--ink-faint);transform:rotate(45deg);margin-top:-3px}
.dot-live,.dot-soon{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.dot-live{background:var(--best);box-shadow:0 0 8px color-mix(in srgb,var(--best) 70%,transparent)}
.dot-soon{background:transparent;border:1px solid var(--ink-faint)}
.combo-menu{position:absolute;z-index:40;top:calc(100% + 6px);left:0;min-width:330px;max-width:min(94vw,420px);
 background:var(--panel-top);border:1px solid var(--frame);border-radius:10px;padding:6px;
 box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 0 0 3px var(--panel-bot)}
.combo-group{margin:8px 10px 4px;color:var(--ink-faint);font-size:.74rem;letter-spacing:.02em}
.combo-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--ink);
 background:none;border:0;border-radius:7px;padding:9px 10px;cursor:pointer}
.combo-opt b{font-weight:700;display:block;font-size:.95rem}
.combo-opt small{display:block;color:var(--ink-soft);font-size:.78rem;line-height:1.35}
.combo-opt:hover:not(.off){background:color-mix(in srgb,var(--gil) 14%,transparent)}
.combo-opt.sel{background:color-mix(in srgb,var(--best) 13%,transparent)}
.combo-opt.off{cursor:not-allowed}
.combo-opt.off b{color:var(--ink-soft)}
.combo-opt.off small{color:var(--ink-faint)}
.combo-opt .ok,.combo-opt .soon{margin-left:auto;font-size:.7rem;border-radius:999px;padding:3px 9px;white-space:nowrap}
.combo-opt .ok{color:var(--best);border:1px solid var(--best)}
.combo-opt .soon{color:var(--ink-faint);border:1px solid var(--rule)}
.pnote{flex:1 1 100%;margin:2px 0 0;color:var(--ink-faint);font-size:.8rem;max-width:74ch}
/* craft rail */
.crafts{display:flex;gap:8px;overflow-x:auto;padding:14px 4px 4px;scrollbar-width:thin;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 94%,transparent 100%)}
.craft{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:9px 15px 9px 10px;border:1px solid var(--rule);border-radius:999px;
 background:transparent;color:var(--ink);font:inherit;cursor:pointer;white-space:nowrap}
.craft:hover{border-color:var(--c)}
.craft[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);font-weight:700}
.craft svg{width:24px;height:24px;flex:0 0 24px;color:var(--c)}
/* summary */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:16px}
.stat .gil{font-size:inherit;gap:6px}
.stat .gil svg{width:.62em;height:.62em}
.stat b{display:block;font-family:var(--font-display);font-weight:400;font-size:1.55rem;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{color:var(--ink-faint);font-size:.8rem}
.warn{grid-column:1/-1;color:var(--loss);font-size:.9rem}
/* collapsibles */
details>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:14px 22px;font-family:var(--font-display);font-size:1.2rem}
details>summary::-webkit-details-marker{display:none}
.chev{width:12px;height:12px;border-right:2px solid var(--ink-faint);border-bottom:2px solid var(--ink-faint);transform:rotate(-45deg);transition:transform .15s}
details[open]>summary .chev{transform:rotate(45deg)}
summary .meta{margin-left:auto;font-family:var(--font-body);font-size:.85rem;color:var(--ink-faint);font-weight:400;display:flex;gap:14px;align-items:center}
/* price editor */
.price-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:2px 22px;padding:0 22px 18px}
.price-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)}
.price-row .nm{min-width:0;overflow-wrap:anywhere}
.price-row small{display:block;color:var(--ink-faint);font-size:.75rem}
input[type=number]{width:7rem;font:inherit;color:var(--ink);background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--rule);
 border-radius:5px;padding:6px 8px;text-align:right}
input[type=number].set{border-color:var(--gil);color:var(--gil)}
.filter{display:flex;gap:8px;flex-wrap:wrap;padding:0 22px 14px;align-items:center}
.act{background:none;border:1px solid var(--rule);color:var(--ink-soft);border-radius:999px;padding:7px 13px;font:inherit;font-size:.86rem;cursor:pointer}
.act:hover{color:var(--ink);border-color:var(--frame)}
.act.on{border-color:var(--gil);color:var(--gil)}
/* bracket tables */
table{width:100%;border-collapse:collapse;font-size:.93rem}
th{position:sticky;top:0;background:var(--panel-bot);text-align:left;color:var(--ink-faint);font-weight:400;font-size:.76rem;padding:7px 10px;border-bottom:1px solid var(--rule);z-index:1}
td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
tr.best td{background:color-mix(in srgb,var(--best) 11%,transparent)}
tr.unpriced td{opacity:.62}
.rname{font-family:var(--font-display);font-size:1.02rem;line-height:1.25}
.tagline{color:var(--ink-faint);font-size:.78rem;margin-top:2px}
.ings{color:var(--ink-soft);font-size:.84rem;margin-top:3px;line-height:1.45}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.crystal{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;color:var(--ce)}
.crystal .dot{width:9px;height:9px;border-radius:50%;background:var(--ce);box-shadow:0 0 7px color-mix(in srgb,var(--ce) 60%,transparent)}
.gil{display:inline-flex;align-items:center;gap:4px;color:var(--gil);font-variant-numeric:tabular-nums}
.gil svg{width:13px;height:13px}
.pill{display:inline-block;font-size:.7rem;border:1px solid var(--rule);border-radius:4px;padding:0 5px;margin-left:5px;color:var(--ink-faint)}
.pill.best{border-color:var(--best);color:var(--best)}
.pill.ki{border-color:var(--lightning);color:var(--lightning)}
.pill.sub{border-color:var(--ink-faint)}
.pill.wotg{border-color:var(--gil);color:var(--gil)}
.noprice{color:var(--loss)}
.hide{display:none!important}
.note{color:var(--ink-soft);max-width:72ch}
.theme{float:right;margin-top:-4px}
@media(max-width:820px){.hide-sm{display:none}.pad{padding:16px}.price-grid{padding:0 14px 14px}.site-nav{gap:10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</svg>
