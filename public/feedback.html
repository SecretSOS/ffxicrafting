<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Report a Bug — FFXI Crafting</title>
<meta name="description" content="Found wrong data or a bug? Let us know so we can fix it.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
.fb-form{max-width:560px}
.fb-field{margin-bottom:16px}
.fb-label{display:block;font-size:.82rem;color:var(--ink-soft);margin-bottom:4px;font-weight:600}
.fb-label .req{color:var(--loss);margin-left:2px}
.fb-select,.fb-input,.fb-textarea{width:100%;font:inherit;font-size:.88rem;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:8px 12px;transition:border-color .15s}
.fb-select:focus,.fb-input:focus,.fb-textarea:focus{border-color:var(--accent);outline:none}
.fb-textarea{min-height:120px;resize:vertical;line-height:1.5}
.fb-hint{font-size:.72rem;color:var(--ink-faint);margin-top:3px}
.fb-submit{font:inherit;font-size:.88rem;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:6px;padding:10px 28px;cursor:pointer;transition:opacity .15s}
.fb-submit:hover{opacity:.85}
.fb-submit:disabled{opacity:.4;cursor:not-allowed}
.fb-msg{margin-top:12px;padding:10px 14px;border-radius:6px;font-size:.88rem;display:none}
.fb-msg.ok{display:block;background:color-mix(in srgb,var(--gain) 15%,transparent);color:var(--gain);border:1px solid color-mix(in srgb,var(--gain) 30%,transparent)}
.fb-msg.err{display:block;background:color-mix(in srgb,var(--loss) 15%,transparent);color:var(--loss);border:1px solid color-mix(in srgb,var(--loss) 30%,transparent)}
.fb-count{float:right;font-size:.72rem;color:var(--ink-faint)}
</style>
<script src="/nav.js"></script>
</head>
<body>
<nav class="top-bar" id="topBar"></nav>
<nav class="guild-bar" id="guildBar"></nav>
<script>initChrome()</script>
<div class="site-layout">
<aside class="sidebar" id="sidebar"></aside>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<main class="main">
 <section class="panel pad">
  <h1 style="font-size:1.6rem;margin:0 0 .3em">Report a Bug</h1>
  <p style="color:var(--ink-soft);margin:0 0 1.2em;font-size:.92rem;max-width:50ch">Found wrong data, a broken page, or a missing item? Describe what's off and we'll investigate.</p>

  <form class="fb-form" id="fbForm" autocomplete="off">
   <div class="fb-field">
    <label class="fb-label" for="fbPage">Page / Tool</label>
    <select class="fb-select" id="fbPage" name="page">
     <option value="general">General / Site-wide</option>
     <option value="profit">Profit Finder</option>
     <option value="shopping">Shopping List</option>
     <option value="bcnm">BCNM Profit Ranker</option>
     <option value="guildpoints">Guild Points</option>
     <option value="fishing">Fishing Codex</option>
     <option value="vendors">Vendor Directory</option>
     <option value="gardening">Gardening Lookup</option>
     <option value="crafts">Crafts</option>
     <option value="gathering">Gathering</option>
     <option value="zones">Zones</option>
     <option value="nms">NMs</option>
     <option value="bcnms">BCNMs</option>
     <option value="guides">Guides</option>
     <option value="other">Other</option>
    </select>
   </div>

   <div class="fb-field">
    <label class="fb-label" for="fbDesc">What's wrong?<span class="req">*</span></label>
    <textarea class="fb-textarea" id="fbDesc" name="description" required minlength="10" maxlength="2000" placeholder="e.g. Tarutaru Sushi shows wrong ingredients — lists 2x Icefish but it should be 1x"></textarea>
    <div class="fb-hint"><span class="fb-count" id="fbCount">0 / 2000</span>Be specific: item names, numbers, what you expected vs. what you see.</div>
   </div>

   <div class="fb-field">
    <label class="fb-label" for="fbContact">Your name <span style="font-weight:400;color:var(--ink-faint)">(optional)</span></label>
    <input class="fb-input" id="fbContact" name="contact" type="text" maxlength="100" placeholder="In-game name or Discord handle">
    <div class="fb-hint">Only if you'd like credit when we fix it. Not required.</div>
   </div>

   <button class="fb-submit" type="submit" id="fbBtn">Submit Report</button>
   <div class="fb-msg" id="fbMsg"></div>
  </form>
 </section>
<footer id="siteFooter"></footer>
</main>
</div>
<script src="/search.js"></script>
<script src="/icon-sprite.js"></script>
<script src="/item-popup.js"></script>
<script>
(function(){
 var form=document.getElementById('fbForm'),
     desc=document.getElementById('fbDesc'),
     count=document.getElementById('fbCount'),
     btn=document.getElementById('fbBtn'),
     msg=document.getElementById('fbMsg');

 desc.addEventListener('input',function(){
  count.textContent=desc.value.length+' / 2000';
 });

 form.addEventListener('submit',function(e){
  e.preventDefault();
  if(desc.value.trim().length<10){msg.className='fb-msg err';msg.textContent='Please describe the issue (at least 10 characters).';return;}

  btn.disabled=true;
  btn.textContent='Sending…';
  msg.className='fb-msg';msg.style.display='none';

  fetch('/api/feedback',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({
    page:document.getElementById('fbPage').value,
    description:desc.value.trim(),
    contact:document.getElementById('fbContact').value.trim()||null
   })
  }).then(function(r){return r.json()}).then(function(d){
   if(d.ok){
    msg.className='fb-msg ok';
    msg.textContent='Thanks! Your report has been logged. We’ll review it soon.';
    form.reset();count.textContent='0 / 2000';
    btn.textContent='Submitted';
    setTimeout(function(){btn.disabled=false;btn.textContent='Submit Report'},30000);
   }else{
    throw new Error(d.error||'Unknown error');
   }
  }).catch(function(err){
   msg.className='fb-msg err';
   msg.textContent='Failed to send: '+err.message+'. Try again in a moment.';
   btn.disabled=false;btn.textContent='Submit Report';
  });
 });
})();
</script>
</body>
</html>
