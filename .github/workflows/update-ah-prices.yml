name: Update AH Prices

on:
  schedule:
    - cron: '0 8,20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scan mode (full, cooking, etc.)'
        default: 'full'
      rate:
        description: 'Requests per minute'
        default: '20'

permissions:
  contents: write

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan Phoenix XI AH prices
        env:
          SCAN_MODE: ${{ github.event.inputs.mode || 'full' }}
          SCAN_RATE: ${{ github.event.inputs.rate || '20' }}
        run: python tools/scan_phoenix_prices.py

      - name: Commit and push if changed
        run: |
          git diff --quiet public/data/ah-prices.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ah-prices.json
          git commit -m "Update AH prices from Phoenix XI API"
          git push
