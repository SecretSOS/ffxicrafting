name: Update AH Prices

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch AH prices from PSXI.gg
        run: python tools/fetch_ah_prices.py

      - name: Commit and push if changed
        run: |
          git diff --quiet public/data/ah-prices.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/ah-prices.json
          git commit -m "Update AH prices from PSXI.gg"
          git push
